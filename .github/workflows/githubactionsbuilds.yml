name: GitHubActionsBuilds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generate_version_number:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      build_number: ${{ github.ref == 'refs/heads/master' && steps.buildnumber.outputs.build_number || 1 }}

    steps:
      - name: Generate build number
        if: github.ref == 'refs/heads/master'
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


  build_linux_with_codecov:
    needs: generate_version_number

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      VERSION: 1.0.${{ needs.generate_version_number.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-coverage

      - name: Restore
        run: dotnet restore LutzRoederWriter.slnx

      - name: Build
        run: >
          dotnet build
          LutzRoederWriter.slnx
          -c Release
          --no-restore
          /p:Version=${{ env.VERSION }}

      - name: Test with coverage
        run: |
          mkdir -p artifacts/coverage

          dotnet-coverage collect \
            'dotnet test tests/LutzRoederWriter.Tests/LutzRoederWriter.Tests.csproj -f net462 -c Release --no-build --no-restore --verbosity normal' \
            -f cobertura \
            -o './artifacts/coverage/coverage.cobertura.xml'

      - name: List generated files
        run: find artifacts -type f -print

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./artifacts/coverage/coverage.cobertura.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
          verbose: true

      - name: Pack
        run: >
          dotnet pack
          src/LutzRoederWriter/LutzRoederWriter.csproj
          -c Release
          --no-build
          /p:Version=${{ env.VERSION }}
          /p:PackageOutputPath=${{ github.workspace }}/artifacts/packages

      - name: List NuGet packages
        run: ls -lah artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: Devedse.LutzRoederWriterNuGet
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error


  release_github:
    needs:
      - generate_version_number
      - build_linux_with_codecov

    runs-on: ubuntu-latest

    permissions:
      contents: write

    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    env:
      VERSION: 1.0.${{ needs.generate_version_number.outputs.build_number }}

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: Devedse.LutzRoederWriterNuGet
          path: ./artifacts/Devedse.LutzRoederWriterNuGet

      - name: Display downloaded files
        run: |
          find ./artifacts -type f -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            ./artifacts/Devedse.LutzRoederWriterNuGet/Devedse.LutzRoederWriter.${{ env.VERSION }}.nupkg
            ./artifacts/Devedse.LutzRoederWriterNuGet/Devedse.LutzRoederWriter.${{ env.VERSION }}.snupkg


  release_nuget:
    needs:
      - generate_version_number
      - build_linux_with_codecov

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    env:
      VERSION: 1.0.${{ needs.generate_version_number.outputs.build_number }}

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: Devedse.LutzRoederWriterNuGet
          path: ./artifacts/Devedse.LutzRoederWriterNuGet

      - name: Display downloaded files
        run: |
          find ./artifacts -type f -print

      - name: Push NuGet package
        run: >
          dotnet nuget push
          ./artifacts/Devedse.LutzRoederWriterNuGet/Devedse.LutzRoederWriter.${{ env.VERSION }}.nupkg
          --api-key "${{ secrets.NUGETTOKEN }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate